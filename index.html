<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="src/all.min.css">
    <link rel="stylesheet" href="src/output.css">
</head>

<body>

    <!-- login part start -->
    <div id="loginpart" class="">
        <form id="loginfrom">
            <img class="w-full bg-cover bg-center blur-[15px]" src="img/login.jpg" alt="login.jpg">

            <div class=" absolute border w-140 top-30 h-180 right-80 p-20 rounded-2xl backdrop-blur-[10px] bg-white/20">
                <h2 class="text-center text-4xl font-bold mt-8 mb-12">Login</h2>

                <div class="flex flex-col gap-y-8">
                    <div class="flex items-center">
                        <input id="useremail" class="border-b w-full outline-none" type="text" placeholder="username"
                            required>
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <div class="flex items-center">
                        <input id="userpass" class="border-b w-full outline-none" type="password" placeholder="Password"
                            required>
                        <button id="showpass" type="button"> <i id="eyebtn" class="fa-regular fa-eye cursor-pointer"></i></button>
                    </div>
                </div>
                <div class="flex justify-between mt-4">
                    <span> <input type="checkbox" class="mr-2">Remember me</span>
                    <a href="#" class="hover:font-semibold">Forget password?</a>
                </div>
                <button id="loginbtn" type="submit" class="w-full bg-blue-600 py-2 rounded-4xl my-8 text-2xl text-white cursor-pointer">Login</button>

                <div class="text-center text-[20px] text-[#333]">
                    <span>Don't have an account? <a href="#" class=" hover:text-black hover:font-semibold">Register</a></span>
                </div>


                <button id="createbtn" class="mt-6 w-full text-center bg-green-500 text-2xl py-2 rounded-4xl cursor-pointer">Create a new Account </button>
            </div>

        </form>
    </div>
    <!-- login part end -->


    


    <div id="secoupart" class="text-2xl bg-amber-300 p-50 h-50" hidden>
        <h2>wellcome to page</h2>
    </div>


    <script src="js/script.js"></script>
</body>

</html>
