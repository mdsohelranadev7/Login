<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <link rel="stylesheet" href="src/all.min.css">
    <link rel="stylesheet" href="src/output.css">
</head>

<body>

    <!-- login part start -->
    <div class="">
        <div class="">
            <img class="w-full bg-cover bg-center blur-[15px]" src="img/login.jpg" alt="login.jpg">

            <div class=" absolute border w-140 top-30 right-80 p-20 backdrop-filter:blur-[10px] bg-white/1 0">
                <h2 class="text-center text-4xl font-bold mt-8 mb-12">Login</h2>

                <div class="flex flex-col gap-y-8">

                    <div class="flex items-center">
                        <input class="border-b w-full outline-none" type="email" placeholder="email">
                        <i class="fa-regular fa-envelope"></i>
                    </div>
                    <div class="flex items-center">
                        <input class="border-b w-full outline-none" type="password" placeholder="password">
                        <i class="fa-regular fa-eye"></i>

                    </div>
                </div>
                <div class="flex justify-between mt-4">
                    <span> <input type="checkbox">Remember me</span>
                    <a href="#">Forget password?</a>
                </div>
                <button class="w-full bg-blue-600 py-3 rounded-4xl my-8 ">Login</button>

                <div class="text-center">
                    <span>Don't have an account? <a href="#">Register</a></span>
                </div>


            </div>


        </div>
    </div>

    <!-- login part end -->


    <script src="js/script.js"></script>
</body>

</html>
